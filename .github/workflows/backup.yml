# Daily logical backup — the Supabase Free tier has no automated backups.
#
# Dumps the public schema, encrypted with age to vars.BACKUP_AGE_RECIPIENT, to a
# GitHub Actions artifact (30-day retention). The repo is public, so artifacts
# must never hold plaintext data.
# This is a substitute for real PITR, not an equivalent: artifacts expire, and
# a dump is only as good as the restore you have actually tested.

name: DB backup

on:
  schedule:
    - cron: '0 9 * * *' # 09:00 UTC daily
  workflow_dispatch:

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  dump:
    name: pg_dump public schema
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-db-tools

      - name: Encrypted dump
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          BACKUP_AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
        run: scripts/backup-db.sh "ssms-prod-$(date -u +%Y%m%d)"

      - uses: actions/upload-artifact@v4
        with:
          name: db-backup
          path: ssms-prod-*.sql.age
          if-no-files-found: error
          retention-days: 30
