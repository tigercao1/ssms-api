# Nightly check that dev and prod have the same schema and the same applied
# migrations. A difference means something changed one database outside the
# release pipeline (dashboard edit, manual psql) or a release stopped halfway.
#
# Only a hash of each fingerprint leaves the job: the repo is public, and drift
# may include objects that are not in the migrations. To see the difference:
#   diff <(SSMS_ENV=prod ./scripts/db.sh fingerprint) <(SSMS_ENV=dev ./scripts/db.sh fingerprint)

name: Schema drift

on:
  schedule:
    - cron: '30 9 * * *' # 09:30 UTC daily, after the backup
  workflow_dispatch:

jobs:
  dev:
    name: Fingerprint dev
    runs-on: ubuntu-latest
    environment: dev
    outputs:
      hash: ${{ steps.fp.outputs.hash }}
    env:
      DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
      EXPECT_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v5
      - run: scripts/check-db-target.sh
      - id: fp
        run: echo "hash=$(psql "$DATABASE_URL" -X -q -v ON_ERROR_STOP=1 -f scripts/schema-fingerprint.sql | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

  prod:
    name: Fingerprint prod
    runs-on: ubuntu-latest
    environment: production
    outputs:
      hash: ${{ steps.fp.outputs.hash }}
    env:
      DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
      EXPECT_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v5
      - run: scripts/check-db-target.sh
      - id: fp
        run: echo "hash=$(psql "$DATABASE_URL" -X -q -v ON_ERROR_STOP=1 -f scripts/schema-fingerprint.sql | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

  compare:
    name: Compare dev and prod
    needs: [dev, prod]
    runs-on: ubuntu-latest
    steps:
      - env:
          DEV: ${{ needs.dev.outputs.hash }}
          PROD: ${{ needs.prod.outputs.hash }}
        run: |
          echo "dev  $DEV"
          echo "prod $PROD"
          if [ -z "$DEV" ] || [ "$DEV" != "$PROD" ]; then
            echo "::error::dev and prod schemas differ. Compare locally: diff <(SSMS_ENV=prod ./scripts/db.sh fingerprint) <(SSMS_ENV=dev ./scripts/db.sh fingerprint)"
            exit 1
          fi
          echo "dev and prod match."
