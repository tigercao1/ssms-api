# fly.toml app configuration file generated for ssms-api-vivid-brook-6788 on 2026-09-19T20:38:00-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'ssms-api-vivid-brook-6788'
primary_region = 'iad'

[build]
[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'

[checks]
  [checks.health]
    type = "http"
    port = 3000
    path = "/health"
    interval = "30s"
    timeout = "5s"
    # /health makes live calls to Supabase (DB count + JWKS fetch), so allow
    # generous startup time on a 256MB shared VM.
    grace_period = "30s"
